             C 368,212 386,236 386,270
             C 386,341 329,394 258,394
             C 187,394 126,342 126,271
             C 126,254 126,240 133,225
             Z"
          fill="url(#ground)"/>
    <path d="M 189.86133 140.26758
             C 188.30374 140.29962 186.6875 140.53125 185 141
             C 169 145 168 170 161 184
             C 156.47929 192.47634 151.00123 198.39893 145.4668 205.375
