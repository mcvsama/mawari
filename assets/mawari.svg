    <path d="M 145.33789 335.82031
             C 168.86203 371.46971 211.26499 394 258 394
             C 303.62892 394 343.47577 372.11051 366.12695 337.62109
             C 296.40068 395.14199 206.83439 385.41641 145.33789 335.82031
