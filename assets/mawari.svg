<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title description">
  <title id="title">Mawari — small planet</title>
  <desc id="description">A small green planet with rolling hills, surrounded by a circular blue sky.</desc>
  <defs>
    <radialGradient id="sky" cx="44%" cy="43%" r="64%">
      <stop offset="0" stop-color="#b5f0ec"/>
      <stop offset="0.58" stop-color="#65c9e4"/>
      <stop offset="1" stop-color="#3266b1"/>
    </radialGradient>
    <linearGradient id="ground" x1="170" y1="150" x2="329" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b1df88"/>
      <stop offset="0.46" stop-color="#74c477"/>
      <stop offset="1" stop-color="#278469"/>
    </linearGradient>
    <linearGradient id="meadow" x1="191" y1="219" x2="310" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d3eba1"/>
      <stop offset="1" stop-color="#8bce83"/>
    </linearGradient>
  </defs>

  <!-- The circular sky leaves the corners transparent. -->
  <circle cx="256" cy="256" r="224" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#244e8b" stroke-width="4"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Broad highlights suggest clouds without adding small details. -->
  <path d="M 85,253 C 83,197 109,151 146,127"
        fill="none" stroke="#e8fffa" stroke-opacity="0.8" stroke-width="15" stroke-linecap="round"/>
  <path d="M 370,369 C 387,353 400,332 406,309"
        fill="none" stroke="#d5f8f5" stroke-opacity="0.65" stroke-width="12" stroke-linecap="round"/>

  <!-- A halo separates the spherical ground from the surrounding sky. -->
  <circle cx="256" cy="271" r="139" fill="#c8f5df" fill-opacity="0.35"/>
  <!-- Intersections are baked into paths: Qt SVG does not support clipPath. -->
  <g>
    <path d="M 133,225
             C 142,206 153,199 161,184
             C 168,170 169,145 185,141
             C 203,136 213,158 228,161
             C 247,165 260,157 278,164
             C 292,169 298,138 316,144
